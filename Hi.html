<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8"/>
    <title>Kết Bạn Zalo</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Giao diện hộp nhập mật khẩu */
        .password-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        .password-card h3 {
            margin-top: 0;
            color: #333;
        }
        .password-input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        .password-input:focus {
            border-color: #0068ff;
        }
        .submit-btn {
            background-color: #0068ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 87%;
        }
        .submit-btn:hover {
            background-color: #0052cc;
        }
        .error-msg {
            color: #ff3333;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* Giao diện nội dung Zalo (Ẩn lúc đầu) */
        .zalo-card {
            display: none; /* Ẩn mặc định */
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        .zalo-title {
            color: #333333;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .qr-container {
            background: #f7f9fa;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #e1e8ed;
        }
        .qr-code {
            width: 200px;
            height: 200px;
            display: block;
        }
        .qr-hint {
            font-size: 13px;
            color: #666666;
            margin-top: 8px;
            margin-bottom: 0;
        }
        .zalo-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0068ff;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 104, 255, 0.2);
        }
        .zalo-button:hover {
            background-color: #0052cc;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 104, 255, 0.3);
        }
        .zalo-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0068ff;
            font-family: 'Arial Black', sans-serif;
            font-size: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1: Form nhập mật khẩu bảo mật -->
    <div class="password-card" id="lockScreen">
        <h3>Nội dung bảo mật</h3>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Vui lòng nhập mật khẩu để xem thông tin Zalo.</p>
        <input type="password" class="password-input" id="passwordInput" placeholder="Nhập mã pin tại đây..."/>
        <button class="submit-btn" onclick="checkPassword()">Xác nhận</button>
        <div class="error-msg" id="errorMsg">Mật khẩu không chính xác, vui lòng thử lại!</div>
    </div>

    <!-- PHẦN 2: Nội dung Zalo ẩn bên trong -->
    <div class="zalo-card" id="zaloContent">
        <div class="zalo-title">Kết bạn qua Zalo</div>
        
        <div class="qr-container">
            <!-- Ảnh QR Zalo của bạn dưới dạng dữ liệu Base64 -->
            <img class="qr-code" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEBAQMAAAB8g658AAAABlBMVEUAAAD///+l2Z/dAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAC6ElEQVR4nO1Y23GDMBBchaZUKqHpdAKlE8pIZfA9DozAtpAnp7yZfO7F7Go0I62kJOfI8hB69f8C5N+GfS7wW4H9XwU43X7b6wIDKIDmI83XBYDms/h+3eQCZkEw7T9wAbNAs+0XAbPg6b7f3p8ETwHwXOBXgX3CgIDZ8EwAs9gGzAIwG5gLgP0mYBaA/SpwUOBXgf0icNDpFr9LwVv8F0pB+S8gXxcYQAGk+boAMHwmXwG6vS4AgmDaf+ACkM4CZoFm288CmAVmwdN9v70/CXwR7HOBAQfsc4EBFECarwsAwWfyFaDbywWAwOn2C5f6gVngBwWeC/wqsE8YEDAbnglgFtuAWQBmA3MBsN8EzAKwXwUOOP1N9/sB/f9YAKRpvggAnM/kO/bX7XUBYfB0XxsAnM8VAMvXBfAnAdgXbXgmgAnAfhcA/v/F9headeringNugLgP0mYBaA/SpwUOBXgf0icNDpFr9LwVv8F0pB+S8gXxcYQAGk+boAMHwmXwG6vS4AgmDaf+ACZgFAvggA3T6fBeMtgGf6P1gAOP2vAtN/VwC9fGZ9bQCg+bEAPgswC/wqsE8YEDAbnglgFtuAWQBmA3MBsN8EzAKwXwUOOP1N9/sB/f9YAKRpvggAwUf6WQCv9PcA/W0A8Omd9icBIPjE9wMAvwiYCcD4LgAEnwnAeAH6Z8F4CzAX8IvAZ8GvAn0usM8FfhcYQAGk+boAsP6BfWj+v1v39X8b8l9AvkX+X4b8D6L75r/rLw60AAAAAElFTkSuQmCC" alt="Mã QR Zalo"/>
            <p class="qr-hint">Quét mã để mở Zalo</p>
        </div>

        <a href="https://zaloapp.com" target="_blank" class="zalo-button">
            <span class="zalo-icon">Z</span>
            Bấm vào đây để kết bạn
        </a>
    </div>

    <script>
        function checkPassword() {
            var input = document.getElementById("passwordInput").value;
            var lockScreen = document.getElementById("lockScreen");
            var zaloContent = document.getElementById("zaloContent");
            var errorMsg = document.getElementById("errorMsg");

            if (input === "2105") {
                lockScreen.style.display = "none";
                zaloContent.style.display = "inline-block";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("passwordInput").value = "";
            }
        }

        document.getElementById("passwordInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });
    </script>
</body>
</html>
